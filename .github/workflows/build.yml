name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q SimpleCam.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Build
        working-directory: SimpleCam
        run: |
          gradle assembleDebug --console=plain 2>&1 | tee ../build.log
          exit ${PIPESTATUS[0]}
      - name: Show errors
        if: failure()
        run: |
          echo '### BUILD ERRORS' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          grep -E '^e: |error:|What went wrong|Unresolved|Could not|Caused by' -A2 build.log | head -40 >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        with:
          name: SimpleCam-apk
          path: SimpleCam/app/build/outputs/apk/debug/*.apk
